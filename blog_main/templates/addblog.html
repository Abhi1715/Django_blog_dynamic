{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<h3 class="text-center">Add blog</h3>

{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<form method="post" enctype="multipart/form-data" style="width:500px; margin:auto">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-warning">Add Blog</button>
</form>

{% endblock %}
